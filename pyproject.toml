[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "r3pm_net"
version = "0.1.0"
description = "R3PM-Net point cloud registration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "torch",
  "tensorboardX",
  "tqdm",
  "pyyaml",
  "open3d",
  "tabulate",
]

[tool.hatch.build.targets.wheel]
packages = ["r3pm_net", "tools", "dataloader", "thirdparty"]

[tool.jupytext]
formats = "ipynb,py:light"
